<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classe Scrum</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#dfe7f5;--ink:#0f1d3a;--card:#fff;--hl:#ffe14d;--acc:#2b5cff;--ok:#138a5b;--bad:#d63a4a;--mut:#4b5a7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1224;--ink:#eaf0ff;--card:#162042;--hl:#5a4d12;--acc:#7b98ff;--ok:#27b27a;--bad:#ef5a69;--mut:#a3b0d3}}
:root[data-theme="dark"]{--bg:#0c1224;--ink:#eaf0ff;--card:#162042;--hl:#5a4d12;--acc:#7b98ff;--ok:#27b27a;--bad:#ef5a69;--mut:#a3b0d3}
html,body,#root{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.45}
#root{position:relative;overflow:hidden}
.cv{position:absolute;inset:0}
.ui{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:space-between;padding:12px;pointer-events:none;gap:10px}
.ui>*{pointer-events:auto}
.top{display:flex;justify-content:space-between;gap:8px}
.chip{background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:4px 14px;font-weight:600;font-size:14px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:12px 14px;width:min(420px,100%);max-height:44%;overflow:auto;box-sizing:border-box;font-size:14px}
.mid{align-self:flex-start;max-height:68%;width:min(420px,100%)}
h1{margin:0 0 4px;font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.02em}
h2{margin:0 0 6px;font-size:22px}
p{margin:6px 0}
.tag{display:inline-block;background:var(--hl);color:var(--ink);border:2px solid var(--ink);padding:1px 10px;border-radius:6px;font-size:13px;font-weight:600}
.q{font-size:15px;font-weight:600}
.btn{display:block;width:100%;text-align:left;font:inherit;font-size:14px;padding:7px 10px;margin:6px 0;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.btn:hover:not(:disabled){background:var(--hl)}
.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn:disabled{cursor:default}
.btn.on{background:var(--hl)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.pri{background:var(--acc);color:#fff;text-align:center;font-weight:800}
.btn.pri:disabled{opacity:.4}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.roles .btn{margin:0;padding:10px}
.roles b{font-size:16px;display:block}
.fb{border-left:6px solid var(--ok);padding:2px 10px;margin:10px 0}
.fb.r{border-color:var(--bad)}
.bar{height:12px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.over i{background:var(--bad)}
.rec{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.rec span{border:2px solid var(--ink);border-radius:8px;padding:1px 8px;font-size:13px}
.mut{color:var(--mut);font-size:14px}
.bar-t,.bar-b{position:absolute;left:0;right:0;height:0;background:#000;z-index:1;pointer-events:none;transition:height .6s ease}
.bar-t{top:0}.bar-b{bottom:0}
.cin .bar-t,.cin .bar-b{height:12%}
.dlg{align-self:center;width:min(540px,100%);cursor:pointer}
.hid .card{display:none}
.snd{position:absolute;z-index:3;top:calc(54px + env(safe-area-inset-top,0px));right:12px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.tog{position:absolute;z-index:3;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
@media (max-width:560px){.roles{grid-template-columns:1fr}.card{max-height:50%}}
</style>
</head>

const Q=[
{ph:"Valeurs de l'agilité",sp:'sm',
 L:"Les quatre valeurs de l'agilité : les individus et leurs interactions plutôt que les processus et les outils ; un logiciel opérationnel plutôt qu'une documentation exhaustive ; la collaboration avec le client plutôt que la négociation contractuelle ; l'adaptation au changement plutôt que le suivi d'un plan.",
 p:{q:"UniPlan, semaine 2. Le client veut modifier l'écran de l'emploi du temps, mais un étudiant brandit le cahier des charges de 40 pages. Quelle valeur agile invoquez-vous ?",o:[["Suivre un plan plutôt que s'adapter au changement",0],["S'adapter au changement plutôt que suivre un plan",1],["La documentation plutôt qu'un logiciel opérationnel",0]]},
 s:{q:"Votre équipe veut rédiger un rapport de 30 pages avant de coder l'écran de connexion. Quelle valeur agile s'y oppose ?",o:[["Les processus et les outils plutôt que les individus",0],["La négociation contractuelle plutôt que la collaboration",0],["Un logiciel opérationnel plutôt qu'une documentation exhaustive",1]]}},
{ph:"Rôles Scrum",sp:'dev',
 L:"Product Owner : responsable du « quoi » et des priorités (le Product Backlog). Scrum Master : coach de l'équipe, il lève les obstacles. Équipe de développement : auto-organisée, elle réalise l'incrément.",
 p:{q:"Un étudiant demande : « Professeur, quelle fonctionnalité développons-nous en premier ? » Que répondez-vous ?",o:[["Je décide de l'ordre, c'est moi qui dirige le projet",0],["Celle que les développeurs trouvent la plus amusante",0],["C'est au Product Owner de décider. J'aide à clarifier l'objectif.",1]]},
 s:{q:"Vous ne comprenez pas ce que le client attend de l'écran des notes. À qui demandez-vous ?",o:[["Au Scrum Master, qui possède le backlog",0],["Au Product Owner, qui possède le « quoi »",1],["À personne : vous devinez et vous codez",0]]}},
{ph:"Product Backlog",sp:'po',
 L:"Le Product Backlog est une liste ordonnée et évolutive de tout ce dont le produit a besoin, détenue par le Product Owner. Les éléments sont affinés en user stories : « En tant qu'étudiant, je veux..., afin de... ».",
 p:{q:"Le backlog du Product Owner est trié selon celui qui crie le plus fort. Comment le coachez-vous ?",o:[["Trier par valeur métier et affiner en continu les éléments du haut",1],["Le figer : un backlog ne doit jamais changer",0],["Le trier par ordre alphabétique pour plus de clarté",0]]},
 s:{q:"Le Product Backlog contient l'élément « Rendre l'appli jolie ». Que faites-vous ?",o:[["Commencer à choisir des couleurs tout de suite",0],["Demander au PO de l'affiner en user story avec des critères d'acceptation",1],["Le supprimer",0]]}},
{ph:"Planification du sprint",sp:'sm',sprint:1,
 L:"Le Sprint Backlog est l'ensemble des éléments choisis par l'équipe pour le sprint, avec un plan pour les réaliser. La capacité (vélocité) de l'équipe limite son engagement, et l'objectif du sprint donne le cap.",
 p:{q:"Planification du sprint. Animez : c'est l'équipe, pas vous, qui tire les éléments dans le sprint d'une semaine. La vélocité est de 13 points."},
 s:{q:"Planification du sprint. Tirez des éléments dans le Sprint Backlog. La vélocité de votre équipe est de 13 points."}},
{ph:"Mêlée quotidienne",sp:'dev',
 L:"La mêlée quotidienne (Daily Scrum) dure 15 minutes, à la même heure et au même endroit : ce que j'ai fait hier, ce que je ferai aujourd'hui, ce qui me bloque.",
 p:{q:"À la mêlée quotidienne, un développeur lance un débat technique de 10 minutes. Vous...",o:[["Laissez faire, le débat est utile",0],["Rappelez le cadre de 15 minutes et renvoyez les détails à plus tard",1],["Annulez la mêlée",0]]},
 s:{q:"C'est votre tour à la mêlée quotidienne. Quelle intervention est correcte ?",o:[["J'ai bien travaillé, tout va bien",0],["Laissez-moi expliquer chaque ligne de mon code...",0],["Hier : formulaire de connexion. Aujourd'hui : le relier à l'API. Bloqué : pas d'identifiants serveur.",1]]}},
{ph:"Obstacles",sp:'dev',
 L:"Le Scrum Master lève les obstacles. L'équipe les signale tôt et en toute transparence au lieu de les cacher.",
 p:{q:"Le serveur du labo est en panne et deux étudiants ne peuvent pas tester. En tant que Scrum Master, vous...",o:[["Leur dites de contourner le problème discrètement",0],["Levez l'obstacle : contactez l'informatique tout de suite et prévenez l'équipe",1],["Attendez la revue du sprint",0]]},
 s:{q:"Vous êtes bloqué : la clé d'API n'est jamais arrivée. Que faites-vous ?",o:[["Le signalez immédiatement au Scrum Master et à l'équipe",1],["Attendez en silence la fin du sprint",0],["Prenez en cachette une histoire plus facile",0]]}},
{ph:"Revue du sprint",sp:'po',
 L:"La revue du sprint est une démonstration de l'incrément terminé (Done) aux parties prenantes. Leurs retours alimentent le Product Backlog.",
 p:{q:"Fin du sprint. À quoi sert la revue du sprint ?",o:[["À blâmer les développeurs en retard",0],["À présenter des diapositives sur les plans futurs",0],["À inspecter l'incrément fonctionnel avec le client et à adapter le backlog",1]]},
 s:{q:"Vous présentez à la revue du sprint. Que montrez-vous ?",o:[["Un diaporama d'idées",0],["Une démo fonctionnelle de l'écran de l'emploi du temps",1],["Seulement le code source",0]]}},
{ph:"Rétrospective",sp:'sm',
 L:"La rétrospective est le moment où l'équipe examine sa façon de travailler (personnes, outils, processus) et choisit des améliorations pour le prochain sprint. Le Burndown Chart montre ensuite le travail restant en fonction du temps.",
 p:{q:"Le sprint a été tendu. Comment animez-vous la rétrospective ?",o:[["Chercher le coupable",0],["Examiner personnes, outils et processus, puis convenir d'une ou deux améliorations",1],["La sauter, on n'a pas le temps",0]]},
 s:{q:"En rétrospective, quelle contribution est la plus utile ?",o:[["« Marc a été trop lent. »",0],["« Rien à améliorer. »",0],["« Ajoutons une Definition of Done et travaillons en binôme sur les histoires difficiles. »",1]]}}
];

[["Narrateur","Mardi, 8 h 15. L'équipe se met en cercle pour la mêlée quotidienne.",'wide',null],["Développeur","Bon, un petit point de mon côté...",'devs','dev']],

/* ---------- Burndown chart ---------- */
function Burn({tot,score}){
 const W=340,Hh=190,Pd=32,lag=(100-score)/100*tot*.6,ds=[0,1,2,3,4,5];
 const ideal=ds.map(k=>tot*(1-k/5));
 const act=ds.map(k=>k==0?tot:k==5?Math.round(lag*.35):Math.max(0,Math.round(tot*(1-k/5)+lag*Math.sin(k*Math.PI/5))));
 const X=k=>Pd+k*(W-Pd-10)/5,Y=v=>Hh-Pd-v*(Hh-Pd-14)/Math.max(tot,1);
 const pl=a=>a.map((v,k)=>X(k)+','+Y(v)).join(' ');
 return h('svg',{viewBox:`0 0 ${W} ${Hh}`,width:'100%',role:'img','aria-label':'Burndown Chart'},
  h('line',{x1:Pd,y1:Y(0),x2:W-10,y2:Y(0),stroke:'currentColor'}),h('line',{x1:Pd,y1:Y(tot),x2:Pd,y2:Y(0),stroke:'currentColor'}),
  h('polyline',{points:pl(ideal),fill:'none',stroke:'currentColor',strokeDasharray:'5 4',opacity:.6}),
  h('polyline',{points:pl(act),fill:'none',stroke:'var(--acc)',strokeWidth:3}),
  act.map((v,k)=>h('circle',{key:k,cx:X(k),cy:Y(v),r:4,fill:'var(--acc)'})),
  ds.map(k=>h('text',{key:k,x:X(k),y:Hh-14,fontSize:11,textAnchor:'middle',fill:'currentColor'},'Jour '+k)),
  h('text',{x:Pd+6,y:12,fontSize:11,fill:'currentColor'},'Points restants (pointillés = idéal)'),
  h('text',{x:Pd-6,y:Y(tot)+4,fontSize:11,textAnchor:'end',fill:'currentColor'},tot));
}
